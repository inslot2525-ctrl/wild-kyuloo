# Render's free plan sleeps after 15 idle minutes, which wipes the saved demo
# plans and gives the next visitor a ~1 minute cold start. Ping it every 10 min.
# GitHub may delay scheduled runs by a few minutes under load.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 90 --retry 2 https://crowd-kit.onrender.com/api/health
